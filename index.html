  { word: "Get around to", pos: "phr.", zh: "抽空去做", cat: "動詞片語 Phrasal Verbs", example: "I finally got around to reviewing the proposal.", example_zh: "我終於抽出時間審閱了這份提案。" },
  { word: "Get rid of", pos: "phr.", zh: "去除；擺脫", cat: "動詞片語 Phrasal Verbs", example: "The company got rid of outdated equipment.", example_zh: "該公司淘汰了過時的設備。" },
  { word: "Give in", pos: "phr.", zh: "讓步；屈服", cat: "動詞片語 Phrasal Verbs", example: "Management refused to give in to unreasonable demands.", example_zh: "管理層拒絕對不合理的要求讓步。" },
  { word: "Go ahead", pos: "phr.", zh: "著手進行", cat: "動詞片語 Phrasal Verbs", example: "The board approved the plan, so we can go ahead.", example_zh: "董事會核准了計畫,所以我們可以著手進行。" },
  { word: "Go over", pos: "phr.", zh: "檢視；複習", cat: "動詞片語 Phrasal Verbs", example: "Let's go over the figures one more time.", example_zh: "讓我們再檢視一次這些數字。" },
  { word: "Go through", pos: "phr.", zh: "仔細審閱；經歷", cat: "動詞片語 Phrasal Verbs", example: "She went through every clause of the agreement.", example_zh: "她仔細審閱了協議中的每一項條款。" },
  { word: "Hand out", pos: "phr.", zh: "發放", cat: "動詞片語 Phrasal Verbs", example: "Volunteers handed out brochures at the entrance.", example_zh: "志工在入口處發放手冊。" },
  { word: "Hand over", pos: "phr.", zh: "移交", cat: "動詞片語 Phrasal Verbs", example: "He handed over his duties before leaving the company.", example_zh: "他在離職前移交了自己的職務。" },
  { word: "Hang up", pos: "phr.", zh: "掛斷電話", cat: "動詞片語 Phrasal Verbs", example: "Please don't hang up; your call is being transferred.", example_zh: "請不要掛斷,您的來電正在轉接中。" },
  { word: "Hold off", pos: "phr.", zh: "延緩；推遲", cat: "動詞片語 Phrasal Verbs", example: "Let's hold off on the announcement until Monday.", example_zh: "我們把公告延到週一再發布吧。" },
  { word: "Keep track of", pos: "phr.", zh: "追蹤記錄", cat: "動詞片語 Phrasal Verbs", example: "The software helps us keep track of inventory levels.", example_zh: "這套軟體協助我們追蹤庫存水位。" },
  { word: "Lay off", pos: "phr.", zh: "資遣", cat: "動詞片語 Phrasal Verbs", example: "The factory laid off fifty workers last month.", example_zh: "這間工廠上個月資遣了五十名工人。" },
  { word: "Leave out", pos: "phr.", zh: "遺漏；省略", cat: "動詞片語 Phrasal Verbs", example: "You left out the shipping cost in your estimate.", example_zh: "你在估價中遺漏了運費。" },
  { word: "Let down", pos: "phr.", zh: "令人失望", cat: "動詞片語 Phrasal Verbs", example: "The supplier let us down by missing the deadline.", example_zh: "供應商未能趕上期限,讓我們很失望。" },
  { word: "Live up to", pos: "phr.", zh: "不辜負；達到", cat: "動詞片語 Phrasal Verbs", example: "The product lived up to customer expectations.", example_zh: "這項產品達到了顧客的期待。" },
  { word: "Look after", pos: "phr.", zh: "照顧；負責", cat: "動詞片語 Phrasal Verbs", example: "She looks after the company's overseas accounts.", example_zh: "她負責公司的海外客戶帳戶。" },
  { word: "Look forward to", pos: "phr.", zh: "期待", cat: "動詞片語 Phrasal Verbs", example: "We look forward to hearing from you soon.", example_zh: "我們期待很快收到您的回覆。" },
  { word: "Look over", pos: "phr.", zh: "快速檢查", cat: "動詞片語 Phrasal Verbs", example: "Could you look over this draft before I send it?", example_zh: "在我寄出前,可以請你看過這份草稿嗎?" },
  { word: "Look up", pos: "phr.", zh: "查詢", cat: "動詞片語 Phrasal Verbs", example: "Please look up the client's contact details in the database.", example_zh: "請在資料庫中查詢這位客戶的聯絡資訊。" },
  { word: "Make up for", pos: "phr.", zh: "彌補", cat: "動詞片語 Phrasal Verbs", example: "The discount was offered to make up for the delay.", example_zh: "提供折扣是為了彌補這次的延誤。" },
  { word: "Move forward", pos: "phr.", zh: "推進", cat: "動詞片語 Phrasal Verbs", example: "We are ready to move forward with the contract.", example_zh: "我們已準備好推進這份合約。" },
  { word: "Narrow down", pos: "phr.", zh: "縮小範圍", cat: "動詞片語 Phrasal Verbs", example: "We narrowed down the candidates to three finalists.", example_zh: "我們將應徵者縮小到三位決選人選。" },
  { word: "Opt for", pos: "phr.", zh: "選擇", cat: "動詞片語 Phrasal Verbs", example: "Most customers opt for the extended warranty.", example_zh: "大多數顧客選擇延長保固。" },
  { word: "Pass on", pos: "phr.", zh: "轉達；傳遞", cat: "動詞片語 Phrasal Verbs", example: "Please pass on my thanks to the whole team.", example_zh: "請代我向整個團隊轉達謝意。" },
  { word: "Pay off", pos: "phr.", zh: "有回報；還清", cat: "動詞片語 Phrasal Verbs", example: "The investment in training finally paid off.", example_zh: "對訓練的投資終於有了回報。" },
  { word: "Phase out", pos: "phr.", zh: "逐步淘汰", cat: "動詞片語 Phrasal Verbs", example: "The company will phase out the older model next year.", example_zh: "該公司明年將逐步淘汰舊型號。" },
  { word: "Pick up", pos: "phr.", zh: "取件；好轉", cat: "動詞片語 Phrasal Verbs", example: "Sales began to pick up after the new campaign.", example_zh: "新活動推出後銷售開始好轉。" },
  { word: "Put together", pos: "phr.", zh: "彙整；組成", cat: "動詞片語 Phrasal Verbs", example: "She put together a detailed budget proposal.", example_zh: "她彙整了一份詳細的預算提案。" },
  { word: "Put up with", pos: "phr.", zh: "忍受", cat: "動詞片語 Phrasal Verbs", example: "Customers should not have to put up with poor service.", example_zh: "顧客不應該忍受差勁的服務。" },
  { word: "Rely upon", pos: "phr.", zh: "仰賴", cat: "動詞片語 Phrasal Verbs", example: "The factory relies upon a single overseas supplier.", example_zh: "這間工廠仰賴單一的海外供應商。" },
  { word: "Result in", pos: "phr.", zh: "導致", cat: "動詞片語 Phrasal Verbs", example: "The delay resulted in additional shipping costs.", example_zh: "這次延誤導致了額外的運輸成本。" },
  { word: "Run into", pos: "phr.", zh: "遇到(問題)", cat: "動詞片語 Phrasal Verbs", example: "We ran into a few technical problems during setup.", example_zh: "我們在安裝過程中遇到了幾個技術問題。" },
  { word: "Scale back", pos: "phr.", zh: "縮減規模", cat: "動詞片語 Phrasal Verbs", example: "The firm scaled back its expansion plans this year.", example_zh: "該公司今年縮減了擴張計畫的規模。" },
  { word: "Scale up", pos: "phr.", zh: "擴大規模", cat: "動詞片語 Phrasal Verbs", example: "They plan to scale up production next quarter.", example_zh: "他們計劃下一季擴大生產規模。" },
  { word: "See to", pos: "phr.", zh: "負責處理", cat: "動詞片語 Phrasal Verbs", example: "I'll see to the arrangements for the conference.", example_zh: "我會負責處理會議的相關安排。" },
  { word: "Sell out", pos: "phr.", zh: "售罄", cat: "動詞片語 Phrasal Verbs", example: "The tickets sold out within two hours.", example_zh: "門票在兩小時內就售罄了。" },
  { word: "Set out", pos: "phr.", zh: "闡明；出發", cat: "動詞片語 Phrasal Verbs", example: "The report sets out the company's long-term goals.", example_zh: "這份報告闡明了公司的長期目標。" },
  { word: "Settle for", pos: "phr.", zh: "勉強接受", cat: "動詞片語 Phrasal Verbs", example: "We refused to settle for lower-quality materials.", example_zh: "我們拒絕接受品質較差的材料。" },
  { word: "Shop around", pos: "phr.", zh: "貨比三家", cat: "動詞片語 Phrasal Verbs", example: "It pays to shop around before signing a supplier contract.", example_zh: "簽訂供應商合約前貨比三家是值得的。" },
  { word: "Show up", pos: "phr.", zh: "出席；現身", cat: "動詞片語 Phrasal Verbs", example: "Only half of the invited guests showed up.", example_zh: "受邀賓客只有一半出席。" },
  { word: "Shut down", pos: "phr.", zh: "關閉；停止運作", cat: "動詞片語 Phrasal Verbs", example: "The server will shut down for maintenance tonight.", example_zh: "伺服器今晚將關閉進行維護。" },
  { word: "Single out", pos: "phr.", zh: "挑出；特別提及", cat: "動詞片語 Phrasal Verbs", example: "The director singled out her team for exceptional work.", example_zh: "主管特別表揚了她的團隊表現傑出。" },
  { word: "Sort through", pos: "phr.", zh: "整理篩選", cat: "動詞片語 Phrasal Verbs", example: "It took hours to sort through all the applications.", example_zh: "篩選完所有申請表花了好幾個小時。" },
  { word: "Speak up", pos: "phr.", zh: "大聲說；表達意見", cat: "動詞片語 Phrasal Verbs", example: "Employees are encouraged to speak up about safety concerns.", example_zh: "公司鼓勵員工針對安全疑慮表達意見。" },
  { word: "Specialize in", pos: "phr.", zh: "專門從事", cat: "動詞片語 Phrasal Verbs", example: "The firm specializes in corporate tax consulting.", example_zh: "這間公司專門從事企業稅務諮詢。" },
  { word: "Stand out", pos: "phr.", zh: "脫穎而出", cat: "動詞片語 Phrasal Verbs", example: "Her résumé stood out among hundreds of applications.", example_zh: "她的履歷在數百份申請中脫穎而出。" },
  { word: "Start over", pos: "phr.", zh: "重新開始", cat: "動詞片語 Phrasal Verbs", example: "The design was rejected, so we had to start over.", example_zh: "設計被否決了,所以我們必須重新開始。" },
  { word: "Stay on top of", pos: "phr.", zh: "掌握；跟上", cat: "動詞片語 Phrasal Verbs", example: "Managers must stay on top of industry developments.", example_zh: "經理人必須隨時掌握產業發展動態。" },
  { word: "Step down", pos: "phr.", zh: "卸任", cat: "動詞片語 Phrasal Verbs", example: "The CEO will step down at the end of the year.", example_zh: "執行長將於年底卸任。" },
  { word: "Stick to", pos: "phr.", zh: "堅持；遵守", cat: "動詞片語 Phrasal Verbs", example: "We need to stick to the original budget.", example_zh: "我們必須堅守原定的預算。" },
  { word: "Take advantage of", pos: "phr.", zh: "善用；利用", cat: "動詞片語 Phrasal Verbs", example: "Customers can take advantage of the early-bird discount.", example_zh: "顧客可以善用早鳥優惠。" },
  { word: "Take care of", pos: "phr.", zh: "處理；照料", cat: "動詞片語 Phrasal Verbs", example: "My assistant will take care of the travel arrangements.", example_zh: "我的助理會處理旅行相關安排。" },
  { word: "Take off", pos: "phr.", zh: "起飛；迅速成長", cat: "動詞片語 Phrasal Verbs", example: "Online sales really took off during the holidays.", example_zh: "線上銷售在假期期間迅速成長。" },
  { word: "Take on", pos: "phr.", zh: "承擔；雇用", cat: "動詞片語 Phrasal Verbs", example: "She agreed to take on additional responsibilities.", example_zh: "她同意承擔額外的職責。" },
  { word: "Take part in", pos: "phr.", zh: "參與", cat: "動詞片語 Phrasal Verbs", example: "All departments will take part in the annual review.", example_zh: "所有部門都將參與年度檢討。" },
  { word: "Take up", pos: "phr.", zh: "佔用；開始從事", cat: "動詞片語 Phrasal Verbs", example: "The new filing system takes up less office space.", example_zh: "新的檔案系統佔用較少的辦公空間。" },
  { word: "Team up with", pos: "phr.", zh: "與...合作", cat: "動詞片語 Phrasal Verbs", example: "Our company teamed up with a local distributor.", example_zh: "我們公司與一家當地經銷商合作。" },
  { word: "Throw away", pos: "phr.", zh: "丟棄；錯失", cat: "動詞片語 Phrasal Verbs", example: "Don't throw away the receipt; you may need it.", example_zh: "不要丟掉收據,你可能會需要它。" },
  { word: "Try out", pos: "phr.", zh: "試用", cat: "動詞片語 Phrasal Verbs", example: "Customers can try out the software free for 30 days.", example_zh: "顧客可以免費試用這套軟體30天。" },
  { word: "Turn down", pos: "phr.", zh: "拒絕；調低", cat: "動詞片語 Phrasal Verbs", example: "He turned down the job offer for personal reasons.", example_zh: "他因個人因素婉拒了這份工作邀約。" },
  { word: "Turn in", pos: "phr.", zh: "繳交", cat: "動詞片語 Phrasal Verbs", example: "All timesheets must be turned in by Friday.", example_zh: "所有工時表必須在週五前繳交。" },
  { word: "Turn out", pos: "phr.", zh: "結果是", cat: "動詞片語 Phrasal Verbs", example: "The event turned out to be a great success.", example_zh: "這場活動結果非常成功。" },
  { word: "Wait on", pos: "phr.", zh: "等候；服務", cat: "動詞片語 Phrasal Verbs", example: "We are waiting on approval from head office.", example_zh: "我們正在等候總公司的核准。" },
  { word: "Watch out for", pos: "phr.", zh: "留意；小心", cat: "動詞片語 Phrasal Verbs", example: "Watch out for hidden fees in the contract.", example_zh: "請留意合約中的隱藏費用。" },
  { word: "Weigh in on", pos: "phr.", zh: "發表意見", cat: "動詞片語 Phrasal Verbs", example: "The consultant weighed in on the restructuring plan.", example_zh: "顧問針對這項重組計畫發表了意見。" },
  { word: "Work around", pos: "phr.", zh: "設法解決；避開", cat: "動詞片語 Phrasal Verbs", example: "We found a way to work around the scheduling conflict.", example_zh: "我們找到方法解決了行程衝突的問題。" },
  { word: "Round off", pos: "phr.", zh: "圓滿結束", cat: "動詞片語 Phrasal Verbs", example: "The director rounded off the meeting with a short summary.", example_zh: "主管以簡短的總結圓滿結束了會議。" },
  { word: "Write off", pos: "phr.", zh: "沖銷；註銷", cat: "動詞片語 Phrasal Verbs", example: "The company wrote off the unpaid debt.", example_zh: "該公司沖銷了這筆未清償的債務。" },
  { word: "Zero in on", pos: "phr.", zh: "聚焦於", cat: "動詞片語 Phrasal Verbs", example: "The report zeroes in on the main cause of the loss.", example_zh: "這份報告聚焦於虧損的主要原因。" },
  { word: "Branch out", pos: "phr.", zh: "拓展業務", cat: "動詞片語 Phrasal Verbs", example: "The bakery branched out into catering services.", example_zh: "這家烘焙坊拓展業務至外燴服務。" },
  { word: "Bring down", pos: "phr.", zh: "降低", cat: "動詞片語 Phrasal Verbs", example: "Automation helped bring down production costs.", example_zh: "自動化協助降低了生產成本。" },
  { word: "Call in", pos: "phr.", zh: "請(專人)來；打電話通知", cat: "動詞片語 Phrasal Verbs", example: "We called in a specialist to inspect the machinery.", example_zh: "我們請了一位專家來檢查機械設備。" },
  { word: "Cash in on", pos: "phr.", zh: "從中獲利", cat: "動詞片語 Phrasal Verbs", example: "Retailers cashed in on the holiday shopping season.", example_zh: "零售商從假期購物季中獲利。" },
  { word: "Come down to", pos: "phr.", zh: "歸結為", cat: "動詞片語 Phrasal Verbs", example: "The decision comes down to cost and timing.", example_zh: "這個決定歸結為成本與時機兩個因素。" },
  { word: "Cut off", pos: "phr.", zh: "切斷；中斷", cat: "動詞片語 Phrasal Verbs", example: "The power was cut off during the storm.", example_zh: "暴風雨期間電力被切斷了。" },
  { word: "Do without", pos: "phr.", zh: "沒有...也行", cat: "動詞片語 Phrasal Verbs", example: "We can do without the extra features to save costs.", example_zh: "為了節省成本,我們可以不要那些額外功能。" },
  { word: "Draw on", pos: "phr.", zh: "運用；汲取", cat: "動詞片語 Phrasal Verbs", example: "She drew on years of experience to solve the issue.", example_zh: "她運用多年的經驗解決了這個問題。" },
  { word: "Fall behind", pos: "phr.", zh: "落後", cat: "動詞片語 Phrasal Verbs", example: "The project has fallen behind schedule.", example_zh: "這項專案的進度已經落後。" },
  { word: "Fall through", pos: "phr.", zh: "告吹；失敗", cat: "動詞片語 Phrasal Verbs", example: "The deal fell through at the last minute.", example_zh: "這筆交易在最後一刻告吹了。" },
  { word: "Get by", pos: "phr.", zh: "勉強維持", cat: "動詞片語 Phrasal Verbs", example: "The department got by with limited staff last month.", example_zh: "該部門上個月在人手有限的情況下勉強維持運作。" },
  { word: "Go under", pos: "phr.", zh: "倒閉", cat: "動詞片語 Phrasal Verbs", example: "Several small firms went under during the recession.", example_zh: "不景氣期間有幾家小公司倒閉了。" },
  { word: "Hold up", pos: "phr.", zh: "耽擱；支撐", cat: "動詞片語 Phrasal Verbs", example: "Bad weather held up the delivery for two days.", example_zh: "惡劣天候使配送耽擱了兩天。" },
  { word: "Iron out", pos: "phr.", zh: "解決(分歧)", cat: "動詞片語 Phrasal Verbs", example: "The two sides ironed out their differences.", example_zh: "雙方解決了彼此的分歧。" },
  { word: "Jot down", pos: "phr.", zh: "記下", cat: "動詞片語 Phrasal Verbs", example: "Let me jot down your contact information.", example_zh: "讓我記下您的聯絡資訊。" },
  { word: "Keep an eye on", pos: "phr.", zh: "留意；看管", cat: "動詞片語 Phrasal Verbs", example: "Please keep an eye on the budget this quarter.", example_zh: "請留意本季的預算狀況。" },
  { word: "Level off", pos: "phr.", zh: "趨於平穩", cat: "動詞片語 Phrasal Verbs", example: "Sales rose sharply and then leveled off.", example_zh: "銷售額急速上升後趨於平穩。" },
  { word: "Map out", pos: "phr.", zh: "規劃", cat: "動詞片語 Phrasal Verbs", example: "The team mapped out a five-year growth strategy.", example_zh: "團隊規劃了一項五年成長策略。" },
  { word: "Pull off", pos: "phr.", zh: "成功完成", cat: "動詞片語 Phrasal Verbs", example: "They pulled off the product launch despite the tight deadline.", example_zh: "儘管時間緊迫,他們仍成功完成了產品發表。" },
  { word: "Roll out", pos: "phr.", zh: "推出；上線", cat: "動詞片語 Phrasal Verbs", example: "The company will roll out the update next week.", example_zh: "該公司下週將推出這項更新。" },
  { word: "Sign off on", pos: "phr.", zh: "批准；簽核", cat: "動詞片語 Phrasal Verbs", example: "The director needs to sign off on all major purchases.", example_zh: "所有重大採購都需要主管簽核。" },
  { word: "Sum up", pos: "phr.", zh: "總結", cat: "動詞片語 Phrasal Verbs", example: "To sum up, the results exceeded our expectations.", example_zh: "總結來說,結果超出了我們的預期。" },
  { word: "According to", pos: "phr.", zh: "根據", cat: "介系詞片語 Prepositional Phrases", example: "According to the survey, most customers prefer online booking.", example_zh: "根據這項調查,大多數顧客偏好線上訂位。" },
  { word: "Ahead of schedule", pos: "phr.", zh: "提前於進度", cat: "介系詞片語 Prepositional Phrases", example: "The construction was completed ahead of schedule.", example_zh: "工程提前於進度完工。" },
  { word: "Behind schedule", pos: "phr.", zh: "進度落後", cat: "介系詞片語 Prepositional Phrases", example: "The project is two weeks behind schedule.", example_zh: "這項專案的進度落後了兩週。" },
  { word: "At no cost", pos: "phr.", zh: "免費", cat: "介系詞片語 Prepositional Phrases", example: "Repairs are provided at no cost during the warranty period.", example_zh: "保固期內的維修是免費提供的。" },
  { word: "At the latest", pos: "phr.", zh: "最遲", cat: "介系詞片語 Prepositional Phrases", example: "Please submit the form by Friday at the latest.", example_zh: "請最遲於週五前繳交表格。" },
  { word: "By all means", pos: "phr.", zh: "當然可以", cat: "介系詞片語 Prepositional Phrases", example: "By all means, feel free to contact us anytime.", example_zh: "當然,歡迎您隨時與我們聯繫。" },
  { word: "By law", pos: "phr.", zh: "依法", cat: "介系詞片語 Prepositional Phrases", example: "Employers are required by law to provide safety training.", example_zh: "雇主依法必須提供安全訓練。" },
  { word: "Due to", pos: "phr.", zh: "由於", cat: "介系詞片語 Prepositional Phrases", example: "The flight was canceled due to severe weather.", example_zh: "由於惡劣天候,這班航班被取消了。" },
  { word: "For the time being", pos: "phr.", zh: "暫時", cat: "介系詞片語 Prepositional Phrases", example: "We will keep the current system for the time being.", example_zh: "我們暫時會維持使用目前的系統。" },
  { word: "In accordance with", pos: "phr.", zh: "依照", cat: "介系詞片語 Prepositional Phrases", example: "All work is carried out in accordance with safety standards.", example_zh: "所有作業皆依照安全標準進行。" },
  { word: "In addition to", pos: "phr.", zh: "除...之外還有", cat: "介系詞片語 Prepositional Phrases", example: "In addition to a salary, employees receive annual bonuses.", example_zh: "除了薪資之外,員工還可獲得年終獎金。" },
  { word: "In advance", pos: "phr.", zh: "事先", cat: "介系詞片語 Prepositional Phrases", example: "Please book your seat at least a week in advance.", example_zh: "請至少於一週前預訂座位。" },
  { word: "In bulk", pos: "phr.", zh: "大量地", cat: "介系詞片語 Prepositional Phrases", example: "Purchasing in bulk reduces the unit price.", example_zh: "大量採購可降低單價。" },
  { word: "In charge", pos: "phr.", zh: "負責掌管", cat: "介系詞片語 Prepositional Phrases", example: "Who is in charge while the manager is away?", example_zh: "經理不在時由誰負責掌管?" },
  { word: "In compliance with", pos: "phr.", zh: "符合(規範)", cat: "介系詞片語 Prepositional Phrases", example: "The building is in compliance with fire safety codes.", example_zh: "這棟建築符合消防安全法規。" },
  { word: "In detail", pos: "phr.", zh: "詳細地", cat: "介系詞片語 Prepositional Phrases", example: "The report explains the process in detail.", example_zh: "這份報告詳細說明了整個流程。" },
  { word: "In effect", pos: "phr.", zh: "生效中", cat: "介系詞片語 Prepositional Phrases", example: "The new policy is already in effect.", example_zh: "新政策已經生效。" },
  { word: "In exchange for", pos: "phr.", zh: "以...作為交換", cat: "介系詞片語 Prepositional Phrases", example: "Customers receive points in exchange for referrals.", example_zh: "顧客推薦他人可獲得點數作為回饋。" },
  { word: "In favor of", pos: "phr.", zh: "贊成", cat: "介系詞片語 Prepositional Phrases", example: "Most board members voted in favor of the proposal.", example_zh: "大多數董事會成員投票贊成這項提案。" },
  { word: "In full", pos: "phr.", zh: "全額地", cat: "介系詞片語 Prepositional Phrases", example: "The invoice must be paid in full within 30 days.", example_zh: "此發票須於30天內全額付清。" },
  { word: "In general", pos: "phr.", zh: "一般而言", cat: "介系詞片語 Prepositional Phrases", example: "In general, customers are satisfied with the service.", example_zh: "一般而言,顧客對服務感到滿意。" },
  { word: "In observance of", pos: "phr.", zh: "為慶祝/紀念", cat: "介系詞片語 Prepositional Phrases", example: "The office will be closed in observance of the national holiday.", example_zh: "辦公室將因國定假日而休息。" },
  { word: "In order to", pos: "phr.", zh: "為了", cat: "介系詞片語 Prepositional Phrases", example: "In order to save time, we automated the process.", example_zh: "為了節省時間,我們將流程自動化。" },
  { word: "In person", pos: "phr.", zh: "親自", cat: "介系詞片語 Prepositional Phrases", example: "Applicants must submit the documents in person.", example_zh: "申請人必須親自繳交文件。" },
  { word: "In place of", pos: "phr.", zh: "代替", cat: "介系詞片語 Prepositional Phrases", example: "She attended the meeting in place of her supervisor.", example_zh: "她代替主管出席了會議。" },
  { word: "In question", pos: "phr.", zh: "所討論的", cat: "介系詞片語 Prepositional Phrases", example: "The invoice in question was issued last month.", example_zh: "所討論的這張發票是上個月開立的。" },
  { word: "In response to", pos: "phr.", zh: "回應", cat: "介系詞片語 Prepositional Phrases", example: "In response to customer feedback, we extended our hours.", example_zh: "為回應顧客意見,我們延長了營業時間。" },
  { word: "In stock", pos: "phr.", zh: "有庫存", cat: "介系詞片語 Prepositional Phrases", example: "The item is currently in stock and ready to ship.", example_zh: "此商品目前有庫存,可立即出貨。" },
  { word: "Out of stock", pos: "phr.", zh: "缺貨", cat: "介系詞片語 Prepositional Phrases", example: "We apologize that the product is out of stock.", example_zh: "很抱歉,此產品目前缺貨。" },
  { word: "In terms of", pos: "phr.", zh: "就...而言", cat: "介系詞片語 Prepositional Phrases", example: "In terms of cost, the second option is better.", example_zh: "就成本而言,第二個選項比較好。" },
  { word: "In transit", pos: "phr.", zh: "運送途中", cat: "介系詞片語 Prepositional Phrases", example: "Your package is currently in transit.", example_zh: "您的包裹目前正在運送途中。" },
  { word: "In writing", pos: "phr.", zh: "以書面形式", cat: "介系詞片語 Prepositional Phrases", example: "All complaints must be submitted in writing.", example_zh: "所有投訴都必須以書面形式提出。" },
  { word: "On a regular basis", pos: "phr.", zh: "定期地", cat: "介系詞片語 Prepositional Phrases", example: "Equipment is inspected on a regular basis.", example_zh: "設備會定期接受檢查。" },
  { word: "On account of", pos: "phr.", zh: "因為", cat: "介系詞片語 Prepositional Phrases", example: "The event was postponed on account of low registration.", example_zh: "由於報名人數過少,活動延期了。" },
  { word: "On average", pos: "phr.", zh: "平均而言", cat: "介系詞片語 Prepositional Phrases", example: "On average, we process fifty orders per day.", example_zh: "平均而言,我們每天處理五十筆訂單。" },
  { word: "On behalf", pos: "phr.", zh: "代表(某方)", cat: "介系詞片語 Prepositional Phrases", example: "He signed the agreement on behalf of the company.", example_zh: "他代表公司簽署了這份協議。" },
  { word: "On hand", pos: "phr.", zh: "在場的；現有的", cat: "介系詞片語 Prepositional Phrases", example: "Technical staff will be on hand during the event.", example_zh: "活動期間技術人員將在場待命。" },
  { word: "On hold", pos: "phr.", zh: "暫停；電話等候中", cat: "介系詞片語 Prepositional Phrases", example: "The project has been put on hold until further notice.", example_zh: "這項專案已暫停,直到另行通知。" },
  { word: "On schedule", pos: "phr.", zh: "按進度", cat: "介系詞片語 Prepositional Phrases", example: "The renovation is proceeding on schedule.", example_zh: "整修工程正按進度進行。" },
  { word: "On site", pos: "phr.", zh: "在現場", cat: "介系詞片語 Prepositional Phrases", example: "A supervisor is required to be on site at all times.", example_zh: "現場必須隨時有一位主管在場。" },
  { word: "On time", pos: "phr.", zh: "準時", cat: "介系詞片語 Prepositional Phrases", example: "The shipment arrived right on time.", example_zh: "這批貨物準時送達。" },
  { word: "Out of order", pos: "phr.", zh: "故障", cat: "介系詞片語 Prepositional Phrases", example: "The elevator is out of order today.", example_zh: "電梯今天故障了。" },
  { word: "Out of date", pos: "phr.", zh: "過期的；過時的", cat: "介系詞片語 Prepositional Phrases", example: "The contact list is completely out of date.", example_zh: "這份聯絡人清單已經完全過時了。" },
  { word: "Regardless of", pos: "phr.", zh: "不論", cat: "介系詞片語 Prepositional Phrases", example: "The policy applies regardless of job title.", example_zh: "此政策不論職稱一律適用。" },
  { word: "Thanks to", pos: "phr.", zh: "多虧", cat: "介系詞片語 Prepositional Phrases", example: "Thanks to the new system, processing time was halved.", example_zh: "多虧了新系統,處理時間縮短了一半。" },
  { word: "Under construction", pos: "phr.", zh: "施工中", cat: "介系詞片語 Prepositional Phrases", example: "The new wing of the building is still under construction.", example_zh: "大樓的新側翼仍在施工中。" },
  { word: "Under consideration", pos: "phr.", zh: "考慮中", cat: "介系詞片語 Prepositional Phrases", example: "Your application is currently under consideration.", example_zh: "您的申請目前正在考慮中。" },
  { word: "Under review", pos: "phr.", zh: "審查中", cat: "介系詞片語 Prepositional Phrases", example: "The proposal is under review by the finance team.", example_zh: "這份提案正由財務團隊審查中。" },
  { word: "Under warranty", pos: "phr.", zh: "在保固期內", cat: "介系詞片語 Prepositional Phrases", example: "The repair is free because the device is still under warranty.", example_zh: "由於裝置仍在保固期內,維修是免費的。" },
  { word: "Up to date", pos: "phr.", zh: "最新的", cat: "介系詞片語 Prepositional Phrases", example: "Please keep your contact details up to date.", example_zh: "請隨時更新您的聯絡資訊。" },
  { word: "With respect to", pos: "phr.", zh: "關於", cat: "介系詞片語 Prepositional Phrases", example: "With respect to pricing, we can offer a discount.", example_zh: "關於價格方面,我們可以提供折扣。" },
  { word: "Without delay", pos: "phr.", zh: "立即", cat: "介系詞片語 Prepositional Phrases", example: "Please forward the documents without delay.", example_zh: "請立即轉寄這些文件。" },
  { word: "Without notice", pos: "phr.", zh: "未經通知", cat: "介系詞片語 Prepositional Phrases", example: "Prices may change without notice.", example_zh: "價格可能未經通知即有所變動。" },
  { word: "At one's convenience", pos: "phr.", zh: "在方便時", cat: "介系詞片語 Prepositional Phrases", example: "Please review the draft at your convenience.", example_zh: "請在您方便時審閱這份草稿。" },
  { word: "At the expense of", pos: "phr.", zh: "以...為代價", cat: "介系詞片語 Prepositional Phrases", example: "Growth should not come at the expense of quality.", example_zh: "成長不應以犧牲品質為代價。" },
  { word: "By means of", pos: "phr.", zh: "藉由", cat: "介系詞片語 Prepositional Phrases", example: "Payments can be made by means of bank transfer.", example_zh: "款項可藉由銀行轉帳支付。" },
  { word: "For the sake of", pos: "phr.", zh: "為了...的緣故", cat: "介系詞片語 Prepositional Phrases", example: "For the sake of clarity, let me repeat the main points.", example_zh: "為了清楚起見,讓我重述一次重點。" },
  { word: "In light of", pos: "phr.", zh: "有鑑於", cat: "介系詞片語 Prepositional Phrases", example: "In light of recent events, the policy will be revised.", example_zh: "有鑑於近期事件,這項政策將被修訂。" },
  { word: "In the event of", pos: "phr.", zh: "萬一發生", cat: "介系詞片語 Prepositional Phrases", example: "In the event of a fire, use the nearest exit.", example_zh: "萬一發生火災,請使用最近的出口。" },
  { word: "On the grounds of", pos: "phr.", zh: "基於...理由", cat: "介系詞片語 Prepositional Phrases", example: "The claim was rejected on the grounds of insufficient evidence.", example_zh: "此索賠因證據不足的理由被駁回。" },
  { word: "A win-win situation", pos: "phr.", zh: "雙贏局面", cat: "商務慣用語 Business Idioms", example: "The partnership created a win-win situation for both firms.", example_zh: "這項合作為雙方公司創造了雙贏局面。" },
  { word: "Ahead of the curve", pos: "phr.", zh: "領先趨勢", cat: "商務慣用語 Business Idioms", example: "The company stays ahead of the curve by investing in research.", example_zh: "該公司透過投資研發保持領先趨勢。" },
  { word: "At stake", pos: "phr.", zh: "岌岌可危；關係重大", cat: "商務慣用語 Business Idioms", example: "The company's reputation is at stake in this negotiation.", example_zh: "公司的聲譽在這場談判中關係重大。" },
  { word: "Bottom line", pos: "phr.", zh: "底線；結論", cat: "商務慣用語 Business Idioms", example: "The bottom line is that we need to cut expenses.", example_zh: "結論就是我們必須削減支出。" },
  { word: "Break even", pos: "phr.", zh: "損益兩平", cat: "商務慣用語 Business Idioms", example: "The new store expects to break even within a year.", example_zh: "這家新店預期一年內達到損益兩平。" },
  { word: "Business as usual", pos: "phr.", zh: "一切照常", cat: "商務慣用語 Business Idioms", example: "Despite the renovation, it is business as usual.", example_zh: "儘管在整修中,營運仍一切照常。" },
  { word: "Call the shots", pos: "phr.", zh: "發號施令", cat: "商務慣用語 Business Idioms", example: "The regional director calls the shots on all budget matters.", example_zh: "區域總監在所有預算事務上發號施令。" },
  { word: "Corner the market", pos: "phr.", zh: "壟斷市場", cat: "商務慣用語 Business Idioms", example: "The firm has cornered the market in eco-friendly packaging.", example_zh: "該公司已壟斷環保包裝市場。" },
  { word: "Cut to the chase", pos: "phr.", zh: "直接講重點", cat: "商務慣用語 Business Idioms", example: "Let's cut to the chase and discuss the pricing.", example_zh: "我們直接講重點,來討論價格吧。" },
  { word: "Down the line", pos: "phr.", zh: "日後；將來", cat: "商務慣用語 Business Idioms", example: "This investment will pay off further down the line.", example_zh: "這項投資在日後會有回報。" },
  { word: "Get down to business", pos: "phr.", zh: "開始談正事", cat: "商務慣用語 Business Idioms", example: "Now that everyone is here, let's get down to business.", example_zh: "既然大家都到齊了,我們就開始談正事吧。" },
  { word: "Go the extra mile", pos: "phr.", zh: "加倍努力", cat: "商務慣用語 Business Idioms", example: "Our staff always go the extra mile for customers.", example_zh: "我們的員工總是為顧客加倍努力。" },
  { word: "In the black", pos: "phr.", zh: "有盈餘", cat: "商務慣用語 Business Idioms", example: "After three tough years, the company is finally in the black.", example_zh: "在艱困的三年後,該公司終於轉為盈餘。" },
  { word: "In the red", pos: "phr.", zh: "虧損", cat: "商務慣用語 Business Idioms", example: "The division has been in the red since last quarter.", example_zh: "該部門從上一季開始就處於虧損狀態。" },
  { word: "Learning curve", pos: "phr.", zh: "學習曲線", cat: "商務慣用語 Business Idioms", example: "There is a steep learning curve with the new software.", example_zh: "這套新軟體的學習曲線相當陡峭。" },
  { word: "On the same page", pos: "phr.", zh: "有共識", cat: "商務慣用語 Business Idioms", example: "Let's make sure everyone is on the same page before we start.", example_zh: "開始前讓我們確認大家都有共識。" },
  { word: "Raise the bar", pos: "phr.", zh: "提高標準", cat: "商務慣用語 Business Idioms", example: "The new model raised the bar for the entire industry.", example_zh: "這款新機型提高了整個產業的標準。" },
  { word: "Red tape", pos: "phr.", zh: "繁文縟節", cat: "商務慣用語 Business Idioms", example: "Too much red tape slowed down the approval process.", example_zh: "過多的繁文縟節拖慢了核准流程。" },
  { word: "See eye to eye", pos: "phr.", zh: "看法一致", cat: "商務慣用語 Business Idioms", example: "The two managers don't always see eye to eye on strategy.", example_zh: "這兩位經理在策略上並非總是看法一致。" },
  { word: "Take the lead", pos: "phr.", zh: "帶頭；領先", cat: "商務慣用語 Business Idioms", example: "She will take the lead on the new marketing campaign.", example_zh: "她將帶頭負責這項新的行銷活動。" },
  { word: "The big picture", pos: "phr.", zh: "全局", cat: "商務慣用語 Business Idioms", example: "Try not to lose sight of the big picture.", example_zh: "盡量不要忽略了整體全局。" },
  { word: "Throw in the towel", pos: "phr.", zh: "放棄", cat: "商務慣用語 Business Idioms", example: "After months of losses, they refused to throw in the towel.", example_zh: "經歷數月虧損後,他們仍拒絕放棄。" },
  { word: "Touch and go", pos: "phr.", zh: "情況不明朗", cat: "商務慣用語 Business Idioms", example: "It was touch and go whether the deal would close.", example_zh: "這筆交易能否成交曾一度情況不明朗。" },
  { word: "Uphill battle", pos: "phr.", zh: "艱難的挑戰", cat: "商務慣用語 Business Idioms", example: "Entering that market will be an uphill battle.", example_zh: "進入那個市場將是一項艱難的挑戰。" },
  { word: "Word for word", pos: "phr.", zh: "逐字地", cat: "商務慣用語 Business Idioms", example: "The clause was copied word for word from the old contract.", example_zh: "這項條款是逐字從舊合約複製過來的。" },
  { word: "Across the board", pos: "phr.", zh: "全面地", cat: "商務慣用語 Business Idioms", example: "The company announced pay raises across the board.", example_zh: "該公司宣布全面調薪。" },
  { word: "Bang for the buck", pos: "phr.", zh: "物超所值", cat: "商務慣用語 Business Idioms", example: "This supplier offers the best bang for the buck.", example_zh: "這家供應商提供最物超所值的選擇。" },
  { word: "Be in the loop", pos: "phr.", zh: "掌握最新消息", cat: "商務慣用語 Business Idioms", example: "Please keep the finance team in the loop.", example_zh: "請讓財務團隊隨時掌握最新消息。" },
  { word: "Bend over backwards", pos: "phr.", zh: "竭盡全力", cat: "商務慣用語 Business Idioms", example: "The staff bent over backwards to satisfy the client.", example_zh: "員工竭盡全力讓這位客戶滿意。" },
  { word: "By the book", pos: "phr.", zh: "照規矩來", cat: "商務慣用語 Business Idioms", example: "The audit was conducted strictly by the book.", example_zh: "這次審計嚴格照規矩進行。" },
  { word: "Cut one's losses", pos: "phr.", zh: "止損", cat: "商務慣用語 Business Idioms", example: "They decided to cut their losses and close the branch.", example_zh: "他們決定止損並關閉這間分店。" },
  { word: "Get the green light", pos: "phr.", zh: "獲得許可", cat: "商務慣用語 Business Idioms", example: "The project finally got the green light from headquarters.", example_zh: "這項專案終於獲得總部許可。" },
  { word: "Go back to the drawing board", pos: "phr.", zh: "重新規劃", cat: "商務慣用語 Business Idioms", example: "The design failed testing, so we went back to the drawing board.", example_zh: "設計未通過測試,所以我們重新規劃。" },
  { word: "Hands-on experience", pos: "phr.", zh: "實務經驗", cat: "商務慣用語 Business Idioms", example: "The internship provides valuable hands-on experience.", example_zh: "這份實習提供了寶貴的實務經驗。" },
  { word: "Have a say in", pos: "phr.", zh: "有發言權", cat: "商務慣用語 Business Idioms", example: "Employees have a say in choosing the new benefits plan.", example_zh: "員工在選擇新福利方案上有發言權。" },
  { word: "In a nutshell", pos: "phr.", zh: "簡而言之", cat: "商務慣用語 Business Idioms", example: "In a nutshell, the strategy focuses on cost reduction.", example_zh: "簡而言之,這項策略著重於降低成本。" },
  { word: "Keep costs down", pos: "phr.", zh: "控制成本", cat: "商務慣用語 Business Idioms", example: "Outsourcing helped the firm keep costs down.", example_zh: "外包協助該公司控制成本。" },
  { word: "Long shot", pos: "phr.", zh: "希望渺茫的嘗試", cat: "商務慣用語 Business Idioms", example: "Winning that contract is a long shot, but worth trying.", example_zh: "贏得那份合約希望渺茫,但值得一試。" },
  { word: "Play it by ear", pos: "phr.", zh: "見機行事", cat: "商務慣用語 Business Idioms", example: "We don't have a fixed agenda; we'll play it by ear.", example_zh: "我們沒有固定議程,就見機行事吧。" },
  { word: "Pull strings", pos: "phr.", zh: "動用關係", cat: "商務慣用語 Business Idioms", example: "He pulled a few strings to expedite the permit.", example_zh: "他動用了一些關係以加速取得許可。" },
  { word: "Put in a good word", pos: "phr.", zh: "美言幾句", cat: "商務慣用語 Business Idioms", example: "She put in a good word for him with the hiring manager.", example_zh: "她在招募主管面前為他美言了幾句。" },
  { word: "Rule of thumb", pos: "phr.", zh: "經驗法則", cat: "商務慣用語 Business Idioms", example: "As a rule of thumb, allow two weeks for shipping.", example_zh: "依經驗法則,運送時間請預留兩週。" },
  { word: "Sales pitch", pos: "phr.", zh: "推銷說詞", cat: "商務慣用語 Business Idioms", example: "His sales pitch convinced the entire committee.", example_zh: "他的推銷說詞說服了整個委員會。" },
  { word: "Set the tone", pos: "phr.", zh: "定調", cat: "商務慣用語 Business Idioms", example: "The opening speech set the tone for the conference.", example_zh: "開幕演說為整場會議定調。" },
  { word: "Take it from the top", pos: "phr.", zh: "從頭開始", cat: "商務慣用語 Business Idioms", example: "Let's take it from the top and review each step.", example_zh: "讓我們從頭開始,檢視每一個步驟。" },
  { word: "Take stock of", pos: "phr.", zh: "評估現況", cat: "商務慣用語 Business Idioms", example: "It's time to take stock of our progress this year.", example_zh: "是時候評估我們今年的進展了。" },
  { word: "Test the waters", pos: "phr.", zh: "試探市場反應", cat: "商務慣用語 Business Idioms", example: "We launched a pilot program to test the waters.", example_zh: "我們推出試辦計畫以試探市場反應。" },
  { word: "Tighten one's belt", pos: "phr.", zh: "縮衣節食", cat: "商務慣用語 Business Idioms", example: "The company had to tighten its belt during the downturn.", example_zh: "該公司在經濟低迷期間必須縮衣節食。" },
  { word: "Turn a profit", pos: "phr.", zh: "獲利", cat: "商務慣用語 Business Idioms", example: "The startup turned a profit in its second year.", example_zh: "這家新創公司在第二年開始獲利。" },
  { word: "Up in the air", pos: "phr.", zh: "尚未確定", cat: "商務慣用語 Business Idioms", example: "The launch date is still up in the air.", example_zh: "發表日期目前仍未確定。" },
  { word: "Ballpark figure", pos: "phr.", zh: "大概的數字", cat: "商務慣用語 Business Idioms", example: "Can you give me a ballpark figure for the total cost?", example_zh: "你可以給我一個總成本的大概數字嗎?" },
  { word: "Bread and butter", pos: "phr.", zh: "主要收入來源", cat: "商務慣用語 Business Idioms", example: "Corporate clients are the firm's bread and butter.", example_zh: "企業客戶是該公司的主要收入來源。" },
  { word: "Cash cow", pos: "phr.", zh: "搖錢樹", cat: "商務慣用語 Business Idioms", example: "The subscription service has become their cash cow.", example_zh: "訂閱服務已成為他們的搖錢樹。" },
  { word: "Game plan", pos: "phr.", zh: "策略計畫", cat: "商務慣用語 Business Idioms", example: "We need a clear game plan before the negotiation.", example_zh: "談判前我們需要一套清楚的策略計畫。" },
  { word: "Get a foot in the door", pos: "phr.", zh: "取得入門機會", cat: "商務慣用語 Business Idioms", example: "The internship helped her get a foot in the door.", example_zh: "這份實習幫助她取得了入門機會。" },
  { word: "Ground floor", pos: "phr.", zh: "初始階段", cat: "商務慣用語 Business Idioms", example: "He joined the company on the ground floor.", example_zh: "他在公司的初始階段就加入了。" },
  { word: "Keep one's options open", pos: "phr.", zh: "保留選擇空間", cat: "商務慣用語 Business Idioms", example: "We should keep our options open until the bids arrive.", example_zh: "在標案送達前,我們應保留選擇空間。" },
  { word: "Move the needle", pos: "phr.", zh: "產生實質影響", cat: "商務慣用語 Business Idioms", example: "Small discounts won't move the needle on sales.", example_zh: "小幅折扣對銷售不會產生實質影響。" },
  { word: "On the back burner", pos: "phr.", zh: "暫緩處理", cat: "商務慣用語 Business Idioms", example: "That proposal has been put on the back burner.", example_zh: "那份提案已被暫緩處理。" },
  { word: "Think on one's feet", pos: "phr.", zh: "臨機應變", cat: "商務慣用語 Business Idioms", example: "A good salesperson must think on their feet.", example_zh: "優秀的業務員必須懂得臨機應變。" },
  { word: "Allow me to introduce", pos: "phr.", zh: "容我介紹", cat: "職場溝通 Workplace Expressions", example: "Allow me to introduce our new regional manager.", example_zh: "容我介紹我們的新任區域經理。" },
  { word: "As discussed", pos: "phr.", zh: "如先前所討論", cat: "職場溝通 Workplace Expressions", example: "As discussed, we will finalize the contract on Monday.", example_zh: "如先前所討論,我們將於週一敲定合約。" },
  { word: "As mentioned earlier", pos: "phr.", zh: "如前所述", cat: "職場溝通 Workplace Expressions", example: "As mentioned earlier, the deadline has been extended.", example_zh: "如前所述,截止期限已經延長。" },
  { word: "At your disposal", pos: "phr.", zh: "供您差遣使用", cat: "職場溝通 Workplace Expressions", example: "Our support team is at your disposal around the clock.", example_zh: "我們的支援團隊全天候為您服務。" },
  { word: "Bear in mind", pos: "phr.", zh: "記住；留意", cat: "職場溝通 Workplace Expressions", example: "Please bear in mind that prices exclude tax.", example_zh: "請留意價格並未含稅。" },
  { word: "Be aware that", pos: "phr.", zh: "請注意", cat: "職場溝通 Workplace Expressions", example: "Please be aware that the office closes early on Fridays.", example_zh: "請注意辦公室週五會提早關閉。" },
  { word: "Could you clarify", pos: "phr.", zh: "可以請您說明嗎", cat: "職場溝通 Workplace Expressions", example: "Could you clarify what the additional fee covers?", example_zh: "可以請您說明這筆額外費用包含什麼嗎?" },
  { word: "Feel free to", pos: "phr.", zh: "歡迎隨時", cat: "職場溝通 Workplace Expressions", example: "Feel free to reach out if you have any questions.", example_zh: "如有任何問題,歡迎隨時與我們聯繫。" },
  { word: "For your reference", pos: "phr.", zh: "供您參考", cat: "職場溝通 Workplace Expressions", example: "I've attached the previous report for your reference.", example_zh: "我已附上先前的報告供您參考。" },
  { word: "For your information", pos: "phr.", zh: "謹供參考", cat: "職場溝通 Workplace Expressions", example: "For your information, the meeting room has changed.", example_zh: "謹供參考,會議室已經更換。" },
  { word: "I apologize for the inconvenience", pos: "phr.", zh: "造成不便深感抱歉", cat: "職場溝通 Workplace Expressions", example: "I apologize for the inconvenience caused by the delay.", example_zh: "對於延誤造成的不便,我深感抱歉。" },
  { word: "I'd appreciate it if", pos: "phr.", zh: "若能...我將不勝感激", cat: "職場溝通 Workplace Expressions", example: "I'd appreciate it if you could reply by Thursday.", example_zh: "若您能在週四前回覆,我將不勝感激。" },
  { word: "If you have any questions", pos: "phr.", zh: "如有任何疑問", cat: "職場溝通 Workplace Expressions", example: "If you have any questions, please don't hesitate to ask.", example_zh: "如有任何疑問,請不要猶豫提出。" },
  { word: "Let me know", pos: "phr.", zh: "請告知我", cat: "職場溝通 Workplace Expressions", example: "Let me know if the schedule works for you.", example_zh: "請告知我這個時程對您是否方便。" },
  { word: "Looking forward to your reply", pos: "phr.", zh: "期待您的回覆", cat: "職場溝通 Workplace Expressions", example: "Thank you for your time; looking forward to your reply.", example_zh: "感謝您撥冗,期待您的回覆。" },
  { word: "Please be advised", pos: "phr.", zh: "謹此通知", cat: "職場溝通 Workplace Expressions", example: "Please be advised that the system will be down tonight.", example_zh: "謹此通知,系統今晚將暫停服務。" },
  { word: "Please note that", pos: "phr.", zh: "請注意", cat: "職場溝通 Workplace Expressions", example: "Please note that reservations require a deposit.", example_zh: "請注意訂位需要支付訂金。" },
  { word: "Should you have", pos: "phr.", zh: "倘若您有", cat: "職場溝通 Workplace Expressions", example: "Should you have further concerns, contact our office.", example_zh: "倘若您有其他疑慮,請聯繫我們的辦公室。" },
  { word: "Thank you in advance", pos: "phr.", zh: "先行致謝", cat: "職場溝通 Workplace Expressions", example: "Thank you in advance for your cooperation.", example_zh: "感謝您的配合,先行致謝。" },
  { word: "We regret to inform you", pos: "phr.", zh: "很遺憾通知您", cat: "職場溝通 Workplace Expressions", example: "We regret to inform you that your application was unsuccessful.", example_zh: "很遺憾通知您,您的申請未能成功。" },
  { word: "We are pleased to announce", pos: "phr.", zh: "我們很高興宣布", cat: "職場溝通 Workplace Expressions", example: "We are pleased to announce the opening of our new branch.", example_zh: "我們很高興宣布新分店開幕。" },
  { word: "As soon as convenient", pos: "phr.", zh: "方便時盡快", cat: "職場溝通 Workplace Expressions", example: "Please return the signed form as soon as convenient.", example_zh: "請在方便時盡快寄回已簽署的表格。" },
  { word: "At short notice", pos: "phr.", zh: "臨時地", cat: "職場溝通 Workplace Expressions", example: "Thank you for arranging the meeting at short notice.", example_zh: "感謝您臨時安排這場會議。" },
  { word: "Be my guest", pos: "phr.", zh: "請便", cat: "職場溝通 Workplace Expressions", example: "If you'd like to review the files, be my guest.", example_zh: "如果您想查閱這些檔案,請便。" },
  { word: "Bring to your attention", pos: "phr.", zh: "提請您注意", cat: "職場溝通 Workplace Expressions", example: "I'd like to bring an urgent matter to your attention.", example_zh: "我想提請您注意一件緊急事項。" },
  { word: "Get in line with", pos: "phr.", zh: "與...保持一致", cat: "職場溝通 Workplace Expressions", example: "Our pricing should get in line with market rates.", example_zh: "我們的定價應與市場行情保持一致。" },
  { word: "Give the go-ahead", pos: "phr.", zh: "批准進行", cat: "職場溝通 Workplace Expressions", example: "The client gave the go-ahead for the final design.", example_zh: "客戶批准了最終設計方案。" },
  { word: "Have a word with", pos: "phr.", zh: "與...談一下", cat: "職場溝通 Workplace Expressions", example: "I'd like to have a word with you about the schedule.", example_zh: "我想跟你談一下關於時程的事。" },
  { word: "In due course", pos: "phr.", zh: "在適當時候", cat: "職場溝通 Workplace Expressions", example: "You will receive confirmation in due course.", example_zh: "您將在適當時候收到確認通知。" },
  { word: "Keep me updated", pos: "phr.", zh: "隨時向我更新", cat: "職場溝通 Workplace Expressions", example: "Please keep me updated on the negotiation.", example_zh: "請隨時向我更新談判進度。" },
  { word: "Make an appointment", pos: "phr.", zh: "預約", cat: "職場溝通 Workplace Expressions", example: "I'd like to make an appointment with the director.", example_zh: "我想與主管預約時間。" },
  { word: "Make sure", pos: "phr.", zh: "確保", cat: "職場溝通 Workplace Expressions", example: "Make sure all documents are signed before filing.", example_zh: "歸檔前請確保所有文件都已簽署。" },
  { word: "May I ask", pos: "phr.", zh: "請問", cat: "職場溝通 Workplace Expressions", example: "May I ask who is responsible for this account?", example_zh: "請問這個帳戶是由誰負責的?" },
  { word: "No later than", pos: "phr.", zh: "不得晚於", cat: "職場溝通 Workplace Expressions", example: "Submit your report no later than Friday noon.", example_zh: "請於不晚於週五中午前提交報告。" },
  { word: "On your end", pos: "phr.", zh: "在您那邊", cat: "職場溝通 Workplace Expressions", example: "Is everything working properly on your end?", example_zh: "在您那邊一切運作正常嗎?" },
  { word: "Put in writing", pos: "phr.", zh: "以書面確認", cat: "職場溝通 Workplace Expressions", example: "Could you put that request in writing?", example_zh: "可以請您以書面形式提出該請求嗎?" },
  { word: "Run something by someone", pos: "phr.", zh: "向某人徵詢意見", cat: "職場溝通 Workplace Expressions", example: "Let me run this proposal by my supervisor first.", example_zh: "讓我先向主管徵詢一下這份提案的意見。" },
  { word: "Set up a meeting", pos: "phr.", zh: "安排會議", cat: "職場溝通 Workplace Expressions", example: "Could you set up a meeting with the vendor?", example_zh: "可以請你安排一場與廠商的會議嗎?" },
  { word: "Take the liberty of", pos: "phr.", zh: "冒昧地", cat: "職場溝通 Workplace Expressions", example: "I took the liberty of booking a table for the team.", example_zh: "我冒昧地為團隊訂了位子。" },
  { word: "To be on the safe side", pos: "phr.", zh: "為保險起見", cat: "職場溝通 Workplace Expressions", example: "To be on the safe side, let's order extra supplies.", example_zh: "為保險起見,我們多訂一些物資吧。" },
  { word: "Upon receipt of", pos: "phr.", zh: "一收到", cat: "職場溝通 Workplace Expressions", example: "We will ship the goods upon receipt of payment.", example_zh: "我們將在收到款項後立即出貨。" },
  { word: "With your permission", pos: "phr.", zh: "若您允許", cat: "職場溝通 Workplace Expressions", example: "With your permission, I'd like to share these figures.", example_zh: "若您允許,我想分享這些數據。" },
  { word: "Would you mind", pos: "phr.", zh: "您介意...嗎", cat: "職場溝通 Workplace Expressions", example: "Would you mind forwarding this to the legal team?", example_zh: "您介意將這份資料轉給法務團隊嗎?" },
  { word: "Get someone up to speed", pos: "phr.", zh: "讓某人跟上進度", cat: "職場溝通 Workplace Expressions", example: "Please get the new hire up to speed this week.", example_zh: "請在本週讓新進員工跟上進度。" },
  { word: "Go over the details", pos: "phr.", zh: "檢視細節", cat: "職場溝通 Workplace Expressions", example: "Let's go over the details before signing.", example_zh: "簽署前讓我們先檢視細節。" },
  { word: "Hold a meeting", pos: "phr.", zh: "舉行會議", cat: "職場溝通 Workplace Expressions", example: "We will hold a meeting to review the results.", example_zh: "我們將舉行會議來檢視結果。" },
  { word: "In charge of arrangements", pos: "phr.", zh: "負責安排事宜", cat: "職場溝通 Workplace Expressions", example: "She is in charge of arrangements for the conference.", example_zh: "她負責這場會議的安排事宜。" },
  { word: "Keep it brief", pos: "phr.", zh: "長話短說", cat: "職場溝通 Workplace Expressions", example: "Please keep it brief; we only have ten minutes.", example_zh: "請長話短說,我們只有十分鐘。" },
  { word: "Make a note of", pos: "phr.", zh: "記下", cat: "職場溝通 Workplace Expressions", example: "Please make a note of the revised deadline.", example_zh: "請記下修改後的截止日期。" },
  { word: "Reach an agreement", pos: "phr.", zh: "達成協議", cat: "職場溝通 Workplace Expressions", example: "Both parties reached an agreement after long talks.", example_zh: "經過長時間會談後,雙方達成協議。" },
  { word: "Raise a concern", pos: "phr.", zh: "提出疑慮", cat: "職場溝通 Workplace Expressions", example: "Several employees raised concerns about the new policy.", example_zh: "有幾位員工對新政策提出疑慮。" },
  { word: "Schedule a call", pos: "phr.", zh: "安排通話", cat: "職場溝通 Workplace Expressions", example: "Let's schedule a call for early next week.", example_zh: "我們安排下週初通話吧。" },
  { word: "Send over", pos: "phr.", zh: "寄送過來", cat: "職場溝通 Workplace Expressions", example: "Could you send over the revised quotation?", example_zh: "可以請你把修改後的報價單寄過來嗎?" },
  { word: "Stay in touch", pos: "phr.", zh: "保持聯絡", cat: "職場溝通 Workplace Expressions", example: "Let's stay in touch regarding future opportunities.", example_zh: "關於未來的合作機會,讓我們保持聯絡。" },
  { word: "Take minutes", pos: "phr.", zh: "做會議記錄", cat: "職場溝通 Workplace Expressions", example: "Who will take minutes during today's meeting?", example_zh: "今天的會議由誰來做會議記錄?" },
  { word: "Talk through", pos: "phr.", zh: "詳細討論", cat: "職場溝通 Workplace Expressions", example: "Let's talk through the options before deciding.", example_zh: "決定前讓我們詳細討論各個選項。" },
  { word: "To the best of my knowledge", pos: "phr.", zh: "就我所知", cat: "職場溝通 Workplace Expressions", example: "To the best of my knowledge, the order was shipped.", example_zh: "就我所知,這筆訂單已經出貨了。" },
  { word: "Walk someone through", pos: "phr.", zh: "帶某人逐步了解", cat: "職場溝通 Workplace Expressions", example: "I'll walk you through the registration process.", example_zh: "我會帶你逐步了解報名流程。" },
  { word: "Weigh the pros and cons", pos: "phr.", zh: "權衡利弊", cat: "職場溝通 Workplace Expressions", example: "We should weigh the pros and cons before investing.", example_zh: "投資前我們應該權衡利弊。" },
  { word: "Work overtime", pos: "phr.", zh: "加班", cat: "職場溝通 Workplace Expressions", example: "The team worked overtime to finish the audit.", example_zh: "團隊加班完成了這次審計。" },
  { word: "Abandon", pos: "v.", zh: "放棄；捨棄", cat: "進階動詞 Advanced Verbs", example: "The company abandoned its plan to expand overseas.", example_zh: "該公司放棄了拓展海外的計畫。" },

    example: "The manager is responsible for reviewing all expense reports.",
    example_zh: "經理負責審查所有的費用報告。",
    breakdown: [
      { text: "The manager", tag: "主詞", type: "subject" },
      { text: "is responsible for", tag: "動詞片語＋介系詞", type: "verb" },
      { text: "reviewing all expense reports", tag: "受詞(動名詞片語)", type: "object" }
    ],
    tip: "介系詞後面接動詞時,一律使用動名詞(V-ing)形式,這是多益文法的高頻考點。"
  }
];



let state = {
  tab: loadLastTab(),
  sidebarOpen: false,
  filter: "all",
  search: "",
  favorites: JSON.parse(localStorageSafe()),
  gFilter: "all",
  gSearch: "",
  bookmarks: loadBookmarks(),
  resumeDismissed: { vocab: false, grammar: false }
};

let scrollTimer = null;

function localStorageSafe(){
  try { return localStorage.getItem('toeic_favs') || "[]"; } catch(e) { return "[]"; }
}
function saveFavs(){
  try { localStorage.setItem('toeic_favs', JSON.stringify(state.favorites)); } catch(e) {}
}

/* ===== 停止點 Bookmark / Resume ===== */
function loadBookmarks(){
  try {
    const raw = localStorage.getItem('toeic_bookmarks');
    const b = raw ? JSON.parse(raw) : {};
    return { vocab: b.vocab || null, grammar: b.grammar || null };
  } catch(e) { return { vocab: null, grammar: null }; }
}
function saveBookmarks(){
  try { localStorage.setItem('toeic_bookmarks', JSON.stringify(state.bookmarks)); } catch(e) {}
}
function loadLastTab(){
  try { return localStorage.getItem('toeic_tab') === 'grammar' ? 'grammar' : 'vocab'; } catch(e) { return 'vocab'; }
}
function saveLastTab(){
  try { localStorage.setItem('toeic_tab', state.tab); } catch(e) {}
}

function togglePin(key){
  const cur = state.bookmarks[state.tab];
  if (cur && cur.manual && cur.key === key) {
    state.bookmarks[state.tab] = { key: key, manual: false };
  } else {
    state.bookmarks[state.tab] = { key: key, manual: true };
  }
  saveBookmarks();
  state.resumeDismissed[state.tab] = true;
  if (state.tab === 'vocab') renderVocabListOnly(); else renderGrammarListOnly();
}

function clearBookmark(){
  state.bookmarks[state.tab] = null;
  saveBookmarks();
  if (state.tab === 'vocab') renderVocabTab(); else renderGrammarTab();
}

function isPinned(key){
  const bm = state.bookmarks[state.tab];
  return !!(bm && bm.manual && bm.key === key);
}

function resumeBanner(){
  const bm = state.bookmarks[state.tab];
  if (!bm || !bm.key || state.resumeDismissed[state.tab]) return '';
  const label = bm.manual ? '📌 你設定的停止點' : '🕘 上次讀到';
  return `
    <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-3 mb-4 flex items-center gap-3 flex-wrap">
      <div class="flex-1 min-w-0">
        <p class="text-xs text-indigo-400">${label}</p>
        <p class="text-sm font-semibold text-indigo-800 truncate">${escapeHtml(bm.key)}</p>
      </div>
      <button id="resumeBtn" class="px-3 py-1.5 rounded-full bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700 transition shrink-0">繼續閱讀</button>
      <button id="dismissResumeBtn" class="px-3 py-1.5 rounded-full bg-white text-slate-500 text-xs font-medium hover:bg-slate-100 transition shrink-0">從頭開始</button>
      <button id="clearBookmarkBtn" class="px-2 py-1.5 rounded-full text-slate-400 text-xs hover:bg-white transition shrink-0" title="清除停止點">✕</button>
    </div>
  `;
}

function bindResumeBanner(){
  const r = document.getElementById('resumeBtn');
  if (r) r.addEventListener('click', jumpToBookmark);
  const d = document.getElementById('dismissResumeBtn');
  if (d) d.addEventListener('click', () => {
    state.resumeDismissed[state.tab] = true;
    if (state.tab === 'vocab') renderVocabTab(); else renderGrammarTab();
  });
  const c = document.getElementById('clearBookmarkBtn');
  if (c) c.addEventListener('click', clearBookmark);
}

function jumpToBookmark(){
  const bm = state.bookmarks[state.tab];
  if (!bm || !bm.key) return;
  const inList = state.tab === 'vocab'
    ? filteredVocab().some(v => v.word === bm.key)
    : filteredGrammar().some(g => g.title === bm.key);

  state.resumeDismissed[state.tab] = true;

  if (!inList) {
    if (state.tab === 'vocab') { state.filter = 'all'; state.search = ''; }
    else { state.gFilter = 'all'; state.gSearch = ''; }
  }
  if (state.tab === 'vocab') renderVocabTab(); else renderGrammarTab();

  setTimeout(() => {
    const el = document.querySelector('#tabContent [data-key="' + bm.key.replace(/"/g, '\\"') + '"]');
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('ring-2', 'ring-indigo-400');
    setTimeout(() => el.classList.remove('ring-2', 'ring-indigo-400'), 2000);
  }, 60);
}

function trackScroll(){
  const main = document.getElementById('mainScroll');
  if (!main) return;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const bm = state.bookmarks[state.tab];
    if (bm && bm.manual) return;
    const cards = document.querySelectorAll('#tabContent [data-key]');
    if (!cards.length) return;
    const topEdge = main.getBoundingClientRect().top;
    let found = null;
    for (const c of cards) {
      if (c.getBoundingClientRect().bottom > topEdge + 8) { found = c; break; }
    }
    if (found) {
      state.bookmarks[state.tab] = { key: found.dataset.key, manual: false };
      saveBookmarks();
    }
  }, 400);
}

function speak(text){
  if (!('speechSynthesis' in window)) {
    alert('您的瀏覽器不支援語音朗讀功能');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

function getCategories(){
  return ["all", ...new Set(VOCAB.map(v => v.cat))];
}

function getGrammarCategories(){
  return ["all", ...new Set(GRAMMAR.map(g => g.cat))];
}

function toggleFav(word){
  const idx = state.favorites.indexOf(word);
  if (idx > -1) state.favorites.splice(idx, 1);
  else state.favorites.push(word);
  saveFavs();
  render();
}

function filteredVocab(){
  return VOCAB.filter(v => {
    const matchCat = state.filter === "all" ? true :
      (state.filter === "fav" ? state.favorites.includes(v.word) : v.cat === state.filter);
    const matchSearch = state.search.trim() === "" ? true :
      (v.word.toLowerCase().includes(state.search.toLowerCase()) || v.zh.includes(state.search));
    return matchCat && matchSearch;
  });
}

function filteredGrammar(){
  return GRAMMAR.filter(g => {
    const matchCat = state.gFilter === "all" ? true : g.cat === state.gFilter;
    const matchSearch = state.gSearch.trim() === "" ? true :
      (g.title.toLowerCase().includes(state.gSearch.toLowerCase()) ||
       g.rule.includes(state.gSearch) ||
       g.example.toLowerCase().includes(state.gSearch.toLowerCase()));
    return matchCat && matchSearch;
  });
}

function tagClass(type){
  const map = {
    subject: "bg-blue-50 text-blue-700 border border-blue-200",
    verb: "bg-red-50 text-red-700 border border-red-200",
    object: "bg-green-50 text-green-700 border border-green-200",
    modifier: "bg-purple-50 text-purple-700 border border-purple-200",
    connector: "bg-orange-50 text-orange-700 border border-orange-200",
    complement: "bg-yellow-50 text-yellow-700 border border-yellow-200",
    clause: "bg-pink-50 text-pink-700 border border-pink-200"
  };
  return map[type] || "bg-slate-50 text-slate-700 border border-slate-200";
}

  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="h-screen w-full flex overflow-hidden">
      <aside class="fixed sm:static inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 sm:translate-x-0 ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full'}">
        <div class="p-4 border-b border-slate-100 flex items-start justify-between">
          <div>
            <h1 class="text-lg font-bold text-indigo-700 leading-snug">🎓 多益學習通</h1>
            <p class="text-slate-400 text-xs mt-0.5">TOEIC All-in-One</p>
          </div>
          <button id="sidebarCloseBtn" class="sm:hidden w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100 shrink-0">✕</button>
        </div>
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
          <button id="tabVocabBtn" class="w-full flex items-center gap-2.5 text-left px-3 py-2.5 rounded-xl text-sm font-medium transition
            ${state.tab === 'vocab' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-100'}">
            <span class="text-lg">📘</span><span>單字通</span>
          </button>
          <button id="tabGrammarBtn" class="w-full flex items-center gap-2.5 text-left px-3 py-2.5 rounded-xl text-sm font-medium transition
            ${state.tab === 'grammar' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-100'}">
            <span class="text-lg">📐</span><span>文法通</span>
          </button>
        </nav>
        <div class="p-3 border-t border-slate-100 text-xs text-slate-400">
          ${VOCAB.length} 個單字 · ${GRAMMAR.length} 個文法重點
        </div>
      </aside>

      ${state.sidebarOpen ? '<div id="sidebarOverlay" class="fixed inset-0 bg-black/30 z-30 sm:hidden"></div>' : ''}

      <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
        <div class="sm:hidden flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-100 shrink-0">
          <button id="menuToggleBtn" class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-600 hover:bg-slate-100 text-xl">☰</button>
          <h1 class="font-bold text-indigo-700 text-base">🎓 多益學習通</h1>
        </div>
        <main id="mainScroll" class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div class="max-w-4xl mx-auto">
            <div id="tabContent"></div>
            <footer class="text-center text-xs text-slate-400 mt-8 pb-4">
              ${state.tab === 'vocab'
                ? '💡 點擊喇叭圖示可朗讀單字或例句(需瀏覽器支援語音合成)'
                : '💡 點擊句子中的色塊可看到句構角色標籤,點擊喇叭圖示可朗讀例句'}
            </footer>
          </div>
        </main>
      </div>
    </div>
  `;

  document.getElementById('tabVocabBtn').addEventListener('click', () => {
    state.tab = 'vocab';
    state.sidebarOpen = false;
    saveLastTab();
    render();
  });
  document.getElementById('tabGrammarBtn').addEventListener('click', () => {
    state.tab = 'grammar';
    state.sidebarOpen = false;
    saveLastTab();
    render();
  });
  const mainEl = document.getElementById('mainScroll');
  if (mainEl) mainEl.addEventListener('scroll', trackScroll);
  document.getElementById('menuToggleBtn').addEventListener('click', () => {
    state.sidebarOpen = true;
    render();
  });
  const closeBtn = document.getElementById('sidebarCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', () => {
    state.sidebarOpen = false;
    render();
  });
  const overlay = document.getElementById('sidebarOverlay');
  if (overlay) overlay.addEventListener('click', () => {
    state.sidebarOpen = false;
    render();
  });

  if (state.tab === 'vocab') {
    renderVocabTab();
  } else {
    renderGrammarTab();
  }
}

function renderVocabTab(){
  const container = document.getElementById('tabContent');
  const list = filteredVocab();
  const cats = getCategories();

  container.innerHTML = `
    ${resumeBanner()}
    <div class="bg-white rounded-2xl shadow-sm p-4 mb-5">
      <input id="searchInput" type="text" placeholder="🔍 搜尋單字或中文解釋..."

          ${cats.map(c => `

  `;

  document.getElementById('searchInput').addEventListener('input', (e) => {

function renderVocabListOnly(){
  const list = filteredVocab();
  const countEl = document.querySelectorAll('#tabContent .text-slate-400.mb-3')[0];
  if (countEl) countEl.textContent = `共 ${list.length} 個單字`;
  const grid = document.querySelector('#tabContent .grid.gap-3');

    ` : list.map(v => renderCard(v)).join('');
    attachCardEvents();
  }
}

function renderCard(v){

            📌

        </div>
      </div>
      <div class="mt-3 bg-slate-50 rounded-xl p-3 flex justify-between items-start gap-3">
        <div>
          <p class="text-slate-700 text-sm italic">"${escapeHtml(v.example)}"</p>
          <p class="text-slate-500 text-xs mt-1">${escapeHtml(v.example_zh)}</p>
        </div>

function attachCardEvents(){
  document.querySelectorAll('.speak-word-btn').forEach(btn => {

  });
  document.querySelectorAll('.speak-sentence-btn').forEach(btn => {

  });
  document.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleFav(btn.dataset.word));
  });
  document.querySelectorAll('#tabContent .pin-btn').forEach(btn => {
    btn.addEventListener('click', () => togglePin(btn.dataset.key));
  });
}

      </div>

      <div class="bg-amber-50 border border-amber-100 rounded-xl p-3">
        <p class="text-xs text-amber-700"><span class="font-semibold">💡 考點提醒：</span>${escapeHtml(g.tip)}</p>
      </div>
    </div>
  `;
}

function attachGrammarEvents(){
  document.querySelectorAll('#tabContent .speak-sentence-btn').forEach(btn => {
    btn.addEventListener('click', () => speak(btn.dataset.sentence));
  });
  document.querySelectorAll('#tabContent .pin-btn').forEach(btn => {
    btn.addEventListener('click', () => togglePin(btn.dataset.key));
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
</body>
</html>
